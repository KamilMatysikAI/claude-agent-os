name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependency (pytest only - the package itself is stdlib-only)
        run: python -m pip install --upgrade pip pytest

      - name: Unit tests
        run: python -m pytest -q

      - name: Clean-install smoke test
        env:
          PYTHONUTF8: "1"
        run: |
          WS="$RUNNER_TEMP/agentos-smoke"
          # queue stays disabled: CI never registers a real scheduled job
          python install.py --non-interactive --with-demo --no-queue --workspace "$WS" --owner Alex
          python -m agentos dashboard --workspace "$WS"
          python -m agentos guard --workspace "$WS"
          # idempotency: a second run must not create or conflict anything
          python install.py --non-interactive --with-demo --workspace "$WS" --owner Alex --no-doctor | tee second.txt
          grep -q "created: 0, unchanged: [0-9]*, conflicts: 0," second.txt
          test -f "$WS/projects/dashboard.md"
          # scheduler plan is printed only, never installed
          python -m agentos.scheduler install --workspace "$WS" --interval 30 --print-only
          python install.py uninstall --workspace "$WS"

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # organisation-owned repositories additionally need GITLEAKS_LICENSE (free key)
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
